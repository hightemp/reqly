name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test with coverage (≥ 85% lines)
        run: cargo llvm-cov --workspace --exclude reqly-desktop --exclude spike-http-engine --fail-under-lines 85
      - run: cargo test -p reqly-desktop
      - name: Generated TypeScript bindings are up to date
        run: git diff --exit-code -- ui/src/lib/api/generated

  ui:
    name: UI (lint, unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui lint
      - run: pnpm -C ui coverage

  e2e:
    name: E2E (server + Playwright)
    runs-on: ubuntu-24.04
    needs: [rust, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui exec playwright install --with-deps chromium
      - run: pnpm -C ui e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report

  desktop-e2e:
    name: Desktop E2E (tauri-driver, Linux)
    runs-on: ubuntu-24.04
    needs: [rust, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui build
      - run: cargo build -p reqly-desktop --release --features tauri/custom-protocol
      - run: xvfb-run pnpm -C apps/desktop e2e

  desktop:
    name: Desktop build (${{ matrix.os }})
    needs: [rust, ui]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: reqly-desktop-${{ matrix.os }}
          path: target/release/bundle/
          if-no-files-found: error

  android:
    name: Android (APK + emulator smoke)
    runs-on: ubuntu-24.04
    needs: [rust, ui]
    env:
      NDK_VERSION: 28.0.12433566
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          tc="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          # OpenSSL (openssl-src) and QuickJS bindings (bindgen) need the NDK
          # archiver and sysroot spelled out.
          for target in x86_64-linux-android; do
            t=${target//-/_}
            {
              echo "AR_$t=$tc/bin/llvm-ar"
              echo "RANLIB_$t=$tc/bin/llvm-ranlib"
              echo "BINDGEN_EXTRA_CLANG_ARGS_$t=--sysroot=$tc/sysroot"
            } >> "$GITHUB_ENV"
          done
      - run: pnpm install --frozen-lockfile
      # The Tauri CLI passes the Android link flags as target rustflags, which
      # a global RUSTFLAGS would override.
      - name: Build the debug APK (x86_64)
        run: |
          unset RUSTFLAGS
          pnpm -C apps/desktop tauri android build --debug --target x86_64 --apk
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_DEV_STRIP: symbols
      - uses: actions/upload-artifact@v4
        with:
          name: reqly-android-debug
          path: apps/desktop/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb install -r apps/desktop/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            pnpm -C ui e2e:android
