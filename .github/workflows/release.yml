name: Release

on:
  push:
    tags: ['v*']
  # Re-run a release by hand, e.g. to rebuild the Docker image of a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.3.0)
        required: true
      only:
        description: What to build
        type: choice
        options: [all, docker, macos]
        default: all

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  ONLY: ${{ inputs.only || 'all' }}

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.publish.outputs.id }}
      latest: ${{ steps.latest.outputs.latest }}
      desktop: ${{ steps.plan.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Is this the highest version?
        id: latest
        run: |
          highest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -n1)
          echo "latest=$([ "$highest" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Plan
        id: plan
        run: |
          all='[{"platform":"ubuntu-22.04","args":""},{"platform":"windows-latest","args":""},{"platform":"macos-latest","args":"--target universal-apple-darwin"}]'
          case "$ONLY" in
            all) desktop="$all" ;;
            macos) desktop='[{"platform":"macos-latest","args":"--target universal-apple-darwin"}]' ;;
            *) desktop='[]' ;;
          esac
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
      - name: Check versions
        run: |
          version="${TAG#v}"
          grep -q "^version = \"$version\"" Cargo.toml || { echo "Cargo.toml version is not $version"; exit 1; }
          grep -q "\"version\": \"$version\"" ui/package.json || { echo "ui/package.json version is not $version"; exit 1; }
      - name: Release notes
        if: env.ONLY != 'docker'
        env:
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          version="${TAG#v}"
          # The changelog of the workflow's commit: for a tag push it is the tag
          # itself, for a manual run the current branch (newest wording).
          git show "$GITHUB_SHA:CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.md"
          git show "$GITHUB_SHA:scripts/release-notes.sh" > "$RUNNER_TEMP/release-notes.sh"
          bash "$RUNNER_TEMP/release-notes.sh" "$version" "$RUNNER_TEMP/CHANGELOG.md" > notes.md
          {
            echo
            echo '---'
            echo
            echo '**Downloads:** desktop installers for Linux, Windows and macOS, the'
            echo 'Android app (`*_android*.apk`, `.aab`) and the server binary'
            echo '(`reqly-server-*-linux-*.tar.gz`) are attached below.'
            echo "Docker: \`docker pull ghcr.io/hightemp/reqly-server:$version\`"
            if [ -n "$HUB_USER" ]; then
              echo "or \`docker pull $HUB_USER/reqly-server:$version\`."
            fi
          } >> notes.md
      - name: Create or update the release
        id: publish
        if: env.ONLY != 'docker'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "Reqly $TAG" --notes-file notes.md --latest="$LATEST"
          fi
          echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: release
    if: needs.release.outputs.desktop != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.desktop) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      # macOS code signing only when the secrets exist (an empty certificate
      # makes the bundler fail).
      - name: Signing
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$CERT" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            } >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}

  server:
    name: Server binary (${{ matrix.arch }})
    needs: release
    if: needs.release.outputs.desktop != '[]' && (inputs.only || 'all') == 'all'
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui build
      - run: cargo build --release -p reqly-server --locked
      - run: |
          mkdir dist
          tar -C target/release -czf "dist/reqly-server-$TAG-linux-${{ matrix.arch }}.tar.gz" reqly-server
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber

  android:
    name: Android (APK, AAB)
    needs: release
    if: needs.release.outputs.desktop != '[]' && (inputs.only || 'all') == 'all'
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 28.0.12433566
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # Release signing only when the secrets exist; otherwise the APK and
      # AAB are unsigned (see docs/android.md).
      - name: Signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "REQLY_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "REQLY_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "REQLY_ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "REQLY_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      - name: Build
        run: |
          unset RUSTFLAGS
          pnpm -C apps/desktop tauri android build --apk --aab --target aarch64 --target armv7 --target x86_64
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=apps/desktop/gen/android/app/build/outputs
          version="${TAG#v}"
          mkdir dist
          apk=$(ls "$out"/apk/universal/release/*.apk | head -n1)
          aab=$(ls "$out"/bundle/universalRelease/*.aab | head -n1)
          suffix=$(case "$apk" in *unsigned*) echo "-unsigned" ;; esac)
          cp "$apk" "dist/Reqly_${version}_android${suffix}.apk"
          cp "$aab" "dist/Reqly_${version}_android.aab"
          gh release upload "$TAG" dist/* --clobber

  docker:
    name: Docker image
    needs: release
    if: (inputs.only || 'all') != 'macos'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # GHCR always; Docker Hub when DOCKERHUB_USERNAME (variable) and
      # DOCKERHUB_TOKEN (secret) are configured.
      - name: Registries
        id: registries
        env:
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          images="ghcr.io/${OWNER,,}/reqly-server"
          hub=false
          if [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
            images="$images"$'\n'"docker.io/$HUB_USER/reqly-server"
            hub=true
          fi
          {
            echo "hub=$hub"
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: steps.registries.outputs.hub == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ needs.release.outputs.latest }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
