[workspace]
resolver = "3"
members = ["crates/*", "apps/server", "apps/desktop", "spikes/*"]
default-members = ["crates/*", "apps/server"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hightemp/reqly"
rust-version = "1.94"

[workspace.dependencies]
reqly-core = { path = "crates/reqly-core" }
reqly-api = { path = "crates/reqly-api" }
reqly-storage = { path = "crates/reqly-storage" }
reqly-testserver = { path = "crates/reqly-testserver" }
reqly-http = { path = "crates/reqly-http" }
reqly-template = { path = "crates/reqly-template" }
reqly-interop = { path = "crates/reqly-interop" }
reqly-protocols = { path = "crates/reqly-protocols" }
reqly-script = { path = "crates/reqly-script" }
reqly-faker = { path = "crates/reqly-faker" }
reqly-testing = { path = "crates/reqly-testing" }

anyhow = "1"
argon2 = "0.6"
yrs = "0.28"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl"] }
uuid = { version = "1", features = ["v7", "serde"] }

insta = { version = "1", features = ["json", "yaml"] }
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep target/ small: full debug info for dependencies is rarely needed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Password hashing is far too slow unoptimized for tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
