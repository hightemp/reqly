[package]
name = "reqly-http"
description = "HTTP request preparation and the libcurl engine (ADR-002)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reqly-core.workspace = true
base64 = "0.22"
http = "1"
curl = { version = "0.4", default-features = false, features = ["ssl", "static-curl", "static-ssl", "http2", "ntlm"] }
percent-encoding = "2"
rustls-native-certs = "0.8"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"
ts-rs.workspace = true
webpki-root-certs = "1"

[dev-dependencies]
reqly-testserver.workspace = true
proptest.workspace = true

[lints]
workspace = true
