[package]
name = "reqly-http"
description = "HTTP request preparation and the libcurl engine (ADR-002)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reqly-core.workspace = true
base64 = "0.22"
http = "1"
getrandom = "0.3"
hmac = "0.12"
md-5 = "0.10"
md4 = "0.10"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
rsa = { version = "0.9", features = ["sha1", "sha2"] }
sha1 = "0.10"
sha2 = "0.10"
jaq-core = "3"
jaq-json = "2"
jaq-std = "3"
serde_json_path = "0.7"
sxd-document = "0.3"
sxd-xpath = "0.4"
curl = { version = "0.4", default-features = false, features = ["ssl", "static-curl", "static-ssl", "http2", "ntlm"] }
percent-encoding = "2"
rustls-native-certs = "0.8"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"
ts-rs.workspace = true
webpki-root-certs = "1"

[dev-dependencies]
base64 = "0.22"
reqly-testserver.workspace = true
proptest.workspace = true

[lints]
workspace = true
