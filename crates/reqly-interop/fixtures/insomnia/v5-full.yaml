type: collection.insomnia.rest/5.0
schema_version: "5.1"
name: Example API
meta:
  id: wrk_main
  created: 1730540000000
  modified: 1730540000000
  description: Sample workspace
collection:
  - name: Auth
    meta:
      id: fld_auth
      created: 1730541000000
      modified: 1730541000000
      sortKey: -1730541000000
    children:
      - url: "{{ _.base_url }}/auth/login"
        name: Login
        meta:
          id: req_login
          created: 1730541000000
          modified: 1730542000000
          isPrivate: false
          description: Returns a **token**.
          sortKey: -1730541000000
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "user": "{{ _.user }}",
              "password": "{{ _.password }}",
              "device": "{% uuid 'v4' %}"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: X-Request-Time
            value: "{% now 'iso-8601', '' %}"
        scripts:
          afterResponse: insomnia.environment.set('token', insomnia.response.json().token);
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
    environment:
      scope: auth
  - name: Users
    meta:
      id: fld_users
      created: 1730542100000
      modified: 1730542100000
      sortKey: -1730540000000
      description: User management
    children:
      - url: "{{ _.base_url }}/users"
        name: List users
        meta:
          id: req_list
          created: 1730542200000
          modified: 1730542200000
          isPrivate: false
          sortKey: -1730542200000
        method: GET
        parameters:
          - name: page
            value: "1"
          - name: size
            value: "{{ _.page_size }}"
          - name: debug
            value: "true"
            disabled: true
        headers:
          - name: Accept
            value: application/json
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/users/:id"
        name: Get user
        meta:
          id: req_get
          created: 1730542300000
          modified: 1730542300000
          isPrivate: false
          sortKey: -1730542100000
        method: GET
        authentication:
          type: basic
          useISO88591: false
          disabled: false
          username: admin
          password: "{{ _.password }}"
        settings:
          renderRequestBody: true
          encodeUrl: false
          followRedirects: "off"
          cookies:
            send: false
            store: true
          rebuildPath: true
        pathParameters:
          - name: id
            value: "42"
      - url: "{{ _.base_url }}/users/42/avatar"
        name: Upload avatar
        meta:
          id: req_avatar
          created: 1730542400000
          modified: 1730542400000
          isPrivate: false
          sortKey: -1730542000000
        method: PUT
        body:
          mimeType: multipart/form-data
          params:
            - name: title
              value: "{% faker 'randomFullName' %}"
            - name: file
              value: ""
              type: file
              fileName: /home/me/avatar.png
            - name: note
              value: x
              disabled: true
        headers:
          - name: Content-Type
            value: multipart/form-data
        authentication:
          type: apikey
          disabled: false
          key: X-Api-Key
          value: "{{ _.api_key }}"
          addTo: header
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
    scripts:
      preRequest: console.log('folder');
    authentication:
      type: bearer
      token: "{% response 'body', 'req_login', 'b64::JC50b2tlbg==::46b', 'never', 60 %}"
      prefix: ""
      disabled: false
    environment:
      page_size: 20
    headers:
      - name: X-Team
        value: core
  - url: https://search.example.com/q
