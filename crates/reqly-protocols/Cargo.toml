[package]
name = "reqly-protocols"
description = "WebSocket, server-sent events, GraphQL subscriptions and gRPC clients"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
prost-types = "0.14"
tonic-reflection = { version = "0.14", default-features = false }
tower = { version = "0.5", features = ["util"] }
reqly-core.workspace = true
base64 = "0.22"
futures.workspace = true
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
url = "2"
webpki-roots = "1"

[dev-dependencies]
tokio-stream = "0.1"
reqly-testserver.workspace = true
proptest.workspace = true

[lints]
workspace = true
