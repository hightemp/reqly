[package]
name = "reqly-script"
description = "Pre-request and after-response scripts in a QuickJS sandbox (ADR-006)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reqly-core.workspace = true
reqly-template.workspace = true
rquickjs = { version = "0.14", features = ["futures", "macro", "loader"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ts-rs.workspace = true
uuid.workspace = true

# No bundled bindings for Android: generate them (needs libclang).
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.14", features = ["bindgen"] }

[dev-dependencies]

[lints]
workspace = true
